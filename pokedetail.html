<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <!-- Normalize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
        integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="assets/CSS/type-colors.css">
    <link rel="stylesheet" href="assets/CSS/responsive-media-pokedetail.css">
</head>
<body>
    <section class="content">
        <h1>Pokemon Name</h1>
        <span class="pokeImg"><img src="img/pokeball.png" alt="Pokeball"></span>
        <div id="pokeReference" class="pokeReferences">
            <ol class="pokeRefer">
                        <li class="pokeBar">Strong</li>
                        <li class="pokeBar">Weight</li>
                        <li class="pokeBar">Speed</li>
                        <li class="pokeBar">Attack</li>
                        <li class="pokeBar">Special Attack</li>
                        <li class="pokeBar">Damage</li>
                    </ol>
        </div>
        <button id="nextPokemon" type="button">
            Next Pokemon
        </button>        
    </section>
</body>
</html>
